<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio De Sesión</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js"></script>
</head>
<body>
   <img src="imagenes/logo.png" alt="Logo" width="300px" height="300px" id="imagenlogo">
    <center><div class="eslogan">
        <h2>¡Energía Que Fluye!</h2>
    </div></center>
    <div class="principal">
        <div id="div1"class="visible">
            <div class="primera">
                <center><h1>Crear cuenta</h1></center>
                <center>
                    <p>Cree su cuenta para guardar sus datos</p>
                    <input type="text" id="nuevoUsuario" placeholder="Crear usuario">
                    <br>
                    <br>
                    <input type="password" id="nuevaContrasena" placeholder="Crear contraseña">
                    <br>
                    <br>
                    <button onclick="registrar()">Registrarse</button>
                    <br>
                   <button onclick="registrar()"><a href="#" onclick="mostrar('div2')">Iniciar sesión</a></button>
                    <p id="mensaje1"></p>
                </center>
            </div>
        </div>
    
         <div id="div2" class="oculto">
            <div class="segundo">
                <center><h1>Inicio de Sesión</h1></center>
                <center>
                    <p>Ingrese su usuario y contraseña para poder continuar</p>
                    <input type="text" id="usuario" placeholder="Nombre de usuario">
                    <br>
                    <br>
                    <input type="password" id="contrasena" placeholder="Contraseña">
                    <br>
                    <br>
                    <button onclick="iniciarSesion()">Iniciar Sesión</button>
                    <br>
                     <button onclick="registrar()"><a href="#" onclick="mostrar('div1')">Registrarse</a></button>
                    <p id="mensaje2"></p>
                </center>
            </div>
        </div>
    </div>
</body>
</html>
